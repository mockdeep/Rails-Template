name: Propagate to downstream repos

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of an already-merged PR to propagate again
        required: true
        type: string

jobs:
  setup:
    # Manual runs are deliberate, so they skip the merged/author checks that
    # filter automatic runs.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login != 'depfu[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      repos: ${{ steps.read-repos.outputs.repos }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_title: ${{ steps.pr.outputs.title }}
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - id: read-repos
        run: |
          REPOS=$(jq -c . .github/downstream_repos.json)
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

      # Read PR details from the API rather than the event payload so that
      # automatic and manual runs take the same path.
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json mergedAt,mergeCommit,number,title,url > pr.json

          if [ "$(jq -r '.mergedAt // "null"' pr.json)" = "null" ]; then
            echo "PR #$PR_NUMBER is not merged, nothing to propagate"
            exit 1
          fi

          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "merge_sha=$(jq -r '.mergeCommit.oid' pr.json)"
            echo "number=$(jq -r '.number' pr.json)"
            echo "url=$(jq -r '.url' pr.json)"
            echo "title<<$DELIM"
            jq -r '.title' pr.json
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

  propagate:
    needs: setup
    if: needs.setup.outputs.repos != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.setup.outputs.repos) }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Parse repo owner and name
        id: parse
        env:
          REPO: ${{ matrix.repo }}
        run: |
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DOWNSTREAM_APP_ID }}
          private-key: ${{ secrets.DOWNSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.name }}

      - name: Cherry-pick template changes
        id: cherry-pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_SHA: ${{ needs.setup.outputs.merge_sha }}
          TEMPLATE_REPO: ${{ github.repository }}
          DOWNSTREAM_REPO: ${{ matrix.repo }}
          PR_TITLE: ${{ needs.setup.outputs.pr_title }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          PR_URL: ${{ needs.setup.outputs.pr_url }}
        run: ruby .github/scripts/propagate.rb prepare

      - name: Resolve conflicts with Claude
        id: claude
        if: steps.cherry-pick.outputs.has_conflicts == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are resolving merge conflicts in a downstream repository that tracks a template.

            Context:
            - Template repository: ${{ github.repository }}
            - Downstream repository: ${{ matrix.repo }}
            - Template change being applied: "${{ needs.setup.outputs.pr_title }}" (${{ needs.setup.outputs.pr_url }})

            Files with conflicts (containing <<<<<<< markers) are in the downstream/ directory:
            ${{ steps.cherry-pick.outputs.conflicted_files }}

            Instructions:
            1. Read each conflicted file in the downstream/ directory
            2. Resolve every conflict. Default strategy:
               - If the template adds something new (new lines, new config, new functionality), include it alongside the downstream changes
               - If the changes are incompatible, prefer downstream customizations unless the template change is a clear improvement (security fix, critical update)
            3. After resolving all files, run: git -C downstream add -A
            4. Confirm no conflict markers remain by checking for <<<<<<< in each file
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git -C downstream add -A)"

      # The action hides Claude's output, so a failure surfaces only as
      # "is_error:true". Print just the result text to explain why.
      - name: Show Claude failure reason
        if: failure() && steps.claude.conclusion == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          FILE="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -f "$FILE" ]; then
            echo "No execution output found at $FILE"
            exit 0
          fi
          jq -r '.[] | select(.type == "result") | .result // .error // "(no result text)"' "$FILE"

      - name: Finalize and open PR
        if: steps.cherry-pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_SHA: ${{ needs.setup.outputs.merge_sha }}
          TEMPLATE_REPO: ${{ github.repository }}
          DOWNSTREAM_REPO: ${{ matrix.repo }}
          PR_TITLE: ${{ needs.setup.outputs.pr_title }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          PR_URL: ${{ needs.setup.outputs.pr_url }}
          HAS_CONFLICTS: ${{ steps.cherry-pick.outputs.has_conflicts }}
          CONFLICTED_FILES: ${{ steps.cherry-pick.outputs.conflicted_files }}
          DELETED_FILES: ${{ steps.cherry-pick.outputs.deleted_files }}
        run: ruby .github/scripts/propagate.rb finalize
